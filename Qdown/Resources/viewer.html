<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qdown://app; style-src 'self' qdown://app 'unsafe-inline'; img-src qdown: data:; font-src 'self' qdown://app data:; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri qdown:; form-action 'none'">
<base id="qdown-base" href="qdown://doc/">
<title>Qdown</title>
<link rel="stylesheet" href="qdown://app/quiet-light.css">
<link rel="stylesheet" href="qdown://app/viewer.css">
</head>
<body>
<main id="content" class="markdown-body" aria-live="polite"></main>

<!-- Floating table of contents (method A: page-level overlay).
     It must stay outside #content: render() replaces #content.innerHTML, and
     find/A must never pick up the outline text. -->
<aside id="qdown-outline" aria-label="見出し" hidden>
  <div class="qdown-outline-bars" role="navigation" aria-label="見出しバー"></div>
  <div class="qdown-outline-panel" role="navigation" aria-label="見出し一覧"></div>
</aside>

<script src="qdown://app/vendor/marked.min.js"></script>
<script src="qdown://app/vendor/highlight.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/dockerfile.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/powershell.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/dart.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/elixir.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/erlang.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/haskell.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/scala.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/clojure.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/groovy.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/julia.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/ocaml.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/protobuf.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/nix.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/cmake.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/dos.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/http.min.js"></script>
<script src="qdown://app/vendor/highlight-languages/properties.min.js"></script>
<script src="qdown://app/vendor/mermaid.min.js"></script>
<script src="qdown://app/viewer.js"></script>
</body>
</html>
